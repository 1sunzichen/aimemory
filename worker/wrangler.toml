name = "aimemory-ai"
main = "src/index.js"
compatibility_date = "2025-05-19"

# 自定义域名路由（绕过 workers.dev 被墙问题）
routes = [
  { pattern = "ai.memory.oldphoto.site", custom_domain = true }
]

# 部署后在 Cloudflare Dashboard → Settings → Secrets 新增:
#   DEEPSEEK_KEY = sk-xxx
#   DIARY_SECRET = 极染悟心 (日记功能用)

[vars]
DEEPSEEK_API_URL = "https://api.deepseek.com/v1/chat/completions"
