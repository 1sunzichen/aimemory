<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>念张师 · 数字简谱</title>
<style>
  :root { --bg:#0f0f1a; --card:#1a1a2e; --accent:#4a9eff; --text:#e0e0e0; --sub:#888; --border:#2a2a3e; --green:#2ecc71; --yellow:#f39c12; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:20px; }
  .container { max-width:700px; margin:0 auto; }
  h1 { font-size:22px; color:#fff; text-align:center; margin-bottom:4px; }
  .sub { text-align:center; font-size:13px; color:var(--sub); margin-bottom:24px; }

  .section { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px; margin-bottom:16px; }
  .section h3 { font-size:15px; color:var(--accent); margin-bottom:14px; display:flex; align-items:center; gap:8px; }

  .note-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .note-chip {
    width:42px; height:42px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:700; background:rgba(74,158,255,.12);
    color:var(--accent); border:1px solid rgba(74,158,255,.2);
  }
  .note-chip.rest { background:transparent; border:1px dashed var(--border); color:var(--sub); font-size:14px; }

  .lyric-row { font-size:13px; color:var(--sub); margin-bottom:12px; line-height:1.8; }

  .btn { padding:10px 24px; border-radius:10px; border:none; font-size:14px; font-weight:600; cursor:pointer; margin:4px; }
  .btn-accent { background:var(--accent); color:#fff; }
  .btn-green { background:var(--green); color:#fff; }
  .tips { font-size:12px; color:var(--sub); margin-top:10px; line-height:1.6; }
</style>
</head>
<body>
<div class="container">

<h1>🎹 念张师 · 数字简谱</h1>
<p class="sub">原曲：ただ君に晴れ (Yorushika) ｜ 调：C大调 ｜ 键盘：0=C4</p>

<div class="section">
  <h3>🔑 键盘对照</h3>
  <div class="note-row">
    <span class="note-chip">0</span><span class="note-chip">1</span><span class="note-chip">2</span><span class="note-chip">3</span><span class="note-chip">4</span><span class="note-chip">5</span><span class="note-chip">6</span><span class="note-chip">7</span><span class="note-chip">8</span><span class="note-chip">9</span>
  </div>
  <div class="lyric-row">C4  D4  E4  F4  G4  A4  B4  C5  D5  E5</div>
</div>

<div class="section">
  <h3>📖 主歌 A</h3>
  <div class="note-row" id="verse-a"></div>
</div>

<div class="section">
  <h3>📖 主歌 A'（变奏）</h3>
  <div class="note-row" id="verse-a2"></div>
</div>

<div class="section">
  <h3>🎵 副歌</h3>
  <div class="note-row" id="chorus"></div>
</div>

<div class="section">
  <h3>🎵 副歌 B</h3>
  <div class="note-row" id="chorus2"></div>
  <div class="lyric-row" style="margin-top:8px">
    和弦走向：C → G/B → Am → F → C → G → Dm7 → Em (原调 B♭)
  </div>
</div>

<div class="section">
  <h3>📋 复制到钢琴</h3>
  <div style="font-size:14px;word-break:break-all;font-family:monospace;margin-bottom:6px"><b>主歌：</b><span id="copyVerse"></span></div>
  <div style="font-size:14px;word-break:break-all;font-family:monospace;margin-bottom:6px"><b>主歌变奏：</b><span id="copyVerse2"></span></div>
  <div style="font-size:14px;word-break:break-all;font-family:monospace;margin-bottom:6px"><b>副歌：</b><span id="copyChorus"></span></div>
  <div style="font-size:14px;word-break:break-all;font-family:monospace;margin-bottom:10px"><b>副歌B：</b><span id="copyChorus2"></span></div>
  <button class="btn btn-accent" onclick="playAll()">▶ 播全部</button>
  <button class="btn btn-green" onclick="openPiano()">🎹 打开钢琴粘贴</button>
</div>

<div class="tips">
  ⚠️ 这是根据和弦走向 + 原曲记忆写的近似谱，不完全精确。<br>
  对着 B 站「念张师 钢琴改编」视频微调几个音即可。<br>
  主歌节奏：♪♪♩ ♪♪♩ ｜ ♪♪♩ ♪♪♩
</div>

</div>

<script>
// ── 念张师 MIDI 扒谱 (from NianZhangShi.mid, Channel 0 main melody) ──
// 原调 B♭ major → C major 0-9 键盘

// 主歌 A (Opening verse)
var verseNotes = [
  '0','3','4','3','0','1','0','1','0','1','0','-',
  '4','3','0','1','0','1','2','3','1','0','-',
  '3','0','1','0','1','3','4','0','4','3','-',
  '0','1','0','1','0','1','0','1','0','-','-',
];

// 主歌 A' (repeat with variation)
var verseNotes2 = [
  '4','3','0','1','0','1','2','3','1','0','-',
  '3','0','1','0','3','2','0','1','-','-',
  '0','1','3','4','0','4','3','0','1','-',
  '0','1','0','1','0','1','0','-','-','-',
];

// 副歌 (Chorus — the famous hook)
var chorusNotes = [
  '4','3','0','1','0','1','2','3','1','0','3','-',
  '2','1','2','3','2','1','0','-','-','-',
  '1','0','1','0','1','0','1','-','3','-',
  '2','3','5','4','5','3','0','1','3','-',
];

// 副歌 B
var chorusNotes2 = [
  '1','3','5','4','5','0','5','4','-','-',
  '9','3','8','0','7','0','1','-','-','-',
  '0','1','0','1','3','4','3','4','0','5','-',
  '0','5','4','6','4','5','9','3','5','-','-',
];

function renderRow(elId, notes) {
  var el = document.getElementById(elId);
  for (var i = 0; i < notes.length; i++) {
    var n = notes[i];
    var span = document.createElement('span');
    span.className = 'note-chip' + (n === '-' ? ' rest' : '');
    span.textContent = n === '-' ? '—' : n;
    (function(k){ span.onclick = function(){ playNote(k); }; })(n);
    el.appendChild(span);
  }
}

renderRow('verse-a', verseNotes);
renderRow('verse-a2', verseNotes2);
renderRow('chorus', chorusNotes);
renderRow('chorus2', chorusNotes2);

document.getElementById('copyVerse').textContent = verseNotes.join(' ');
document.getElementById('copyVerse2').textContent = verseNotes2.join(' ');
document.getElementById('copyChorus').textContent = chorusNotes.join(' ');
document.getElementById('copyChorus2').textContent = chorusNotes2.join(' ');

// ── Play ──────────────────────────────────────────────────────────
var notes = [
  { key:'0', freq:261.63 },{ key:'1', freq:293.66 },{ key:'2', freq:329.63 },
  { key:'3', freq:349.23 },{ key:'4', freq:392.00 },{ key:'5', freq:440.00 },
  { key:'6', freq:493.88 },{ key:'7', freq:523.25 },{ key:'8', freq:587.33 },
  { key:'9', freq:659.25 },
];
var audioCtx = null;
var playTimer = null;

function playNote(k) {
  if (k === '-') return;
  var note = null;
  for (var i = 0; i < notes.length; i++) { if (notes[i].key === k) { note = notes[i]; break; } }
  if (!note) return;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  var now = audioCtx.currentTime;
  var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(note.freq, now);
  gain.gain.setValueAtTime(0.5, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.4);
}

function playAll() {
  if (playTimer) clearTimeout(playTimer);
  var all = verseNotes.concat(['-','-'], verseNotes2, ['-','-'], chorusNotes, ['-','-'], chorusNotes2);
  var i = 0;
  function step() {
    if (i >= all.length) return;
    playNote(all[i]);
    i++;
    playTimer = setTimeout(step, all[i-1] === '-' ? 350 : 220);
  }
  step();
}

function openPiano() {
  window.open('piano.html', '_blank');
}
</script>
</body>
</html>
