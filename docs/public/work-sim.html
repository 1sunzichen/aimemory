<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外企工作模拟 · English at Work</title>
<style>
  :root {
    --bg: #0f0f1a; --card: #1a1a2e; --accent: #4a9eff;
    --green: #2ecc71; --red: #e74c3c; --yellow: #f39c12;
    --text: #e0e0e0; --sub: #888; --border: #2a2a3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex;
  }

  /* Sidebar */
  .sidebar {
    width: 260px; background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px; flex-shrink: 0;
  }
  .sidebar h2 { font-size: 16px; color: #fff; margin-bottom: 4px; }
  .sidebar .subtitle { font-size: 12px; color: var(--sub); margin-bottom: 20px; }
  .scene-list { flex: 1; overflow-y: auto; }
  .scene-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    font-size: 14px; margin-bottom: 4px; transition: .15s;
    display: flex; align-items: center; gap: 8px;
  }
  .scene-item:hover { background: rgba(255,255,255,.05); }
  .scene-item.active { background: rgba(74,158,255,.15); color: var(--accent); }
  .scene-item.done { opacity: .5; }
  .scene-item .icon { font-size: 18px; }
  .scene-time { font-size: 11px; color: var(--sub); }

  .sidebar-footer {
    border-top: 1px solid var(--border); padding-top: 14px; margin-top: 10px;
    font-size: 12px; color: var(--sub); line-height: 1.6;
  }

  /* Main */
  .main {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }

  /* Header */
  .topbar {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar .day { font-size: 14px; color: var(--sub); }
  .topbar .role-tag {
    background: var(--accent); color: #fff; padding: 4px 12px;
    border-radius: 12px; font-size: 13px; font-weight: 600;
  }
  .topbar .btn-setup {
    background: rgba(255,255,255,.1); border: 1px solid var(--border);
    color: var(--text); padding: 6px 14px; border-radius: 8px;
    cursor: pointer; font-size: 13px;
  }
  .topbar .btn-setup:hover { border-color: var(--accent); }

  /* Chat area */
  .chat {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg {
    display: flex; gap: 10px; max-width: 85%; animation: fadeUp .3s;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
  .msg.them { align-self: flex-start; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }

  .msg .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .msg.them .avatar { background: var(--border); }
  .msg.me .avatar { background: var(--accent); }

  .msg .bubble {
    padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.6;
  }
  .msg.them .bubble {
    background: var(--card); border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .msg.me .bubble {
    background: rgba(74,158,255,.2); border-top-right-radius: 4px;
  }
  .msg .name {
    font-size: 12px; color: var(--accent); margin-bottom: 4px; font-weight: 600;
  }
  .msg .time {
    font-size: 11px; color: var(--sub); margin-top: 4px;
  }

  /* Actions under coworker messages */
  .msg-actions {
    display: flex; gap: 8px; margin-top: 8px;
  }
  .btn-sm {
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: rgba(0,0,0,.2); color: var(--text); font-size: 12px;
    cursor: pointer; transition: .15s;
  }
  .btn-sm:hover { border-color: var(--accent); }
  .btn-sm.recording {
    background: var(--red); color: #fff; border-color: var(--red);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,.4); }
    50% { box-shadow: 0 0 0 8px rgba(231,76,60,0); }
  }

  /* Feedback */
  .feedback-inline {
    margin-top: 6px; padding: 8px 12px; border-radius: 8px;
    background: rgba(0,0,0,.3); font-size: 13px; line-height: 1.6;
    display: none;
  }
  .feedback-inline.show { display: block; }
  .feedback-inline .ok { color: var(--green); }
  .feedback-inline .warn { color: var(--yellow); }
  .feedback-inline .bad { color: var(--red); }

  /* Hint bar */
  .hint-bar {
    padding: 8px 24px; background: rgba(243,156,18,.1);
    border-top: 1px solid rgba(243,156,18,.3); font-size: 13px;
    text-align: center; color: var(--yellow); display: none;
  }
  .hint-bar.show { display: block; }

  /* Input */
  .input-area {
    padding: 16px 24px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end;
  }
  .input-area textarea {
    flex: 1; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; resize: none; outline: none;
    background: var(--card); color: var(--text); font-family: inherit;
    max-height: 80px;
  }
  .input-area textarea:focus { border-color: var(--accent); }
  .btn-send {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 18px;
    cursor: pointer; flex-shrink: 0;
  }
  .btn-send:disabled { opacity: .4; cursor: default; }

  /* Setup overlay */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .overlay-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 30px; max-width: 500px; width: 90%;
  }
  .overlay-box h2 { margin-bottom: 6px; }
  .overlay-box p { color: var(--sub); font-size: 14px; margin-bottom: 20px; }
  .overlay-box label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  .overlay-box textarea, .overlay-box select {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(0,0,0,.3); color: var(--text); font-size: 14px;
    margin-bottom: 16px; font-family: inherit; resize: vertical;
  }
  .overlay-box textarea { min-height: 100px; }
  .overlay-box select { min-height: 42px; }
  .overlay-box .btn-start {
    width: 100%; padding: 14px; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
    cursor: pointer;
  }
  .overlay-box .btn-start:hover { opacity: .9; }
  .overlay-box .btn-start:disabled { opacity: .4; cursor: default; }

  /* Status indicator */
  .mic-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 4px 10px; border-radius: 12px;
  }
  .mic-status.on { background: rgba(46,204,113,.15); color: var(--green); }
  .mic-status.off { background: rgba(231,76,60,.15); color: var(--red); }
  .mic-dot { width: 8px; height: 8px; border-radius: 50%; }
  .mic-status.on .mic-dot { background: var(--green); }
  .mic-status.off .mic-dot { background: var(--red); }
</style>
</head>
<body>

<!-- Setup overlay -->
<div class="overlay" id="setupOverlay">
  <div class="overlay-box">
    <h2>👔 设置你的外企身份</h2>
    <p>粘贴简历关键信息，系统会生成匹配的日常对话场景</p>
    <label>你的岗位（英文）</label>
    <select id="roleSelect">
      <option>Backend Engineer (Go/Python)</option>
      <option>Full-Stack Developer</option>
      <option>DevOps Engineer</option>
      <option>Data Engineer</option>
      <option>ML Engineer</option>
      <option>Frontend Developer</option>
      <option>Product Manager</option>
    </select>
    <label>姓名</label>
    <input type="text" id="nameInput" placeholder="Patrick" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--text);font-size:14px;margin-bottom:16px">
    <label>贴简历关键信息（技能、经验、公司等）</label>
    <textarea id="resumeInput" placeholder="e.g.&#10;Go, Python, Docker, K8s&#10;5 years backend experience&#10;Built microservices handling 10K QPS&#10;Familiar with AWS/GCP"></textarea>
    <button class="btn-start" id="btnStart" onclick="startSim()">🔓 授权麦克风并开始</button>
    <button class="btn-start" id="btnQuick" style="background:var(--green);margin-top:8px" onclick="startSim()">⚡ 一键开始（自动加载简历）</button>
    <div style="margin-top:10px;font-size:12px;color:var(--sub);text-align:center">
      只需授权一次麦克风，之后全程不会弹窗
    </div>
  </div>
</div>

<div class="sidebar">
  <h2>🏢 Day at Work</h2>
  <div class="subtitle" id="dayLabel">Day 1 · Onboarding</div>
  <div class="scene-list" id="sceneList"></div>
  <div class="sidebar-footer">
    <div class="mic-status off" id="micStatus"><span class="mic-dot"></span> 麦克风未授权</div>
    <div style="margin-top:6px">💡 点击场景切换<br>点击 🔊 听同事说话<br>点击 🎤 录音回复</div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <span class="day" id="topDay">Monday, 9:00 AM</span>
    <span class="role-tag" id="roleTag">Backend Engineer</span>
    <button class="btn-setup" onclick="document.getElementById('setupOverlay').style.display='flex'">⚙️ 重新设置</button>
  </div>

  <div class="hint-bar" id="hintBar"></div>

  <div class="chat" id="chatArea">
    <div style="text-align:center;color:var(--sub);padding:80px 20px;font-size:15px;line-height:1.8">
      👈 从左侧选一个场景开始<br>
      或点击场景自动播放
    </div>
  </div>

  <div class="input-area">
    <textarea id="textInput" placeholder="打字回复（或按 🎤 录音）..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText()}"></textarea>
    <button class="btn-send" onclick="sendText()" id="sendBtn" disabled>→</button>
  </div>
</div>

<script>
// ── Pre-loaded resume (auto-detected from PDF) ──────────────────────
const RESUME = {
  name: 'Patrick (孙家奇)',
  role: 'AI Full-Stack Engineer',
  skills: 'Go, React, Python, LLM/RAG, K8s, Docker, Gin, Kitex, Kratos, gRPC, Redis, MySQL',
  experience: '10 years full-stack. Currently at a robotics AI company building robot cloud platform with Go+React. Previously at TAL Education (Go microservices), Shansong (frontend). Built GPU monitoring dashboards, Feishu bot integrations, multi-cloud management.',
  highlights: 'Robot cloud platform · AI Agent · RAG · Go microservices · Multi-cloud GPU orchestration'
};

// Pre-fill setup form
document.getElementById('nameInput').value = RESUME.name;
document.getElementById('roleSelect').value = RESUME.role;
document.getElementById('resumeInput').value = RESUME.skills + '\n' + RESUME.experience;

// ── Global state ───────────────────────────────────────────────────
let userProfile = null;
let audioStream = null; // REUSED — only ask permission once!
let mediaRecorder = null;
let audioChunks = [];
let currentScene = null;
let isRecording = false;
let sceneStates = {}; // per-scene completion

// ── Scenes ─────────────────────────────────────────────────────────
function buildScenes() {
  const role = userProfile?.role || RESUME.role;
  const name = (userProfile?.name || RESUME.name).split(' ')[0]; // Just "Patrick"

  return [
    {
      id: 'intro', time: '9:00 AM', icon: '☕', title: 'Morning Coffee Chat',
      coworker: 'Sarah', coworkerRole: 'Senior Robotics Engineer',
      dialogue: [
        { speaker: 'them', text: `Morning ${name}! So you came from a robotics AI company too? I saw your resume — you worked on a robot cloud management platform. That's exactly what we're building here. Tell me about the GPU monitoring system you built.` },
      ],
      tips: ['用经历回应: "Yeah! We built a Go+React platform for robot config management and multi-cloud GPU monitoring. We used Feishu bots for alerts — saved the team hours every week."', '注意 built 的 t 发音，robot 读作 ROW-bot']
    },
    {
      id: 'standup', time: '9:30 AM', icon: '📋', title: 'Daily Standup',
      coworker: 'Mike', coworkerRole: 'Tech Lead',
      dialogue: [
        { speaker: 'them', text: `Alright team, standup time. ${name}, you're working on the new LLM agent service today, right? How's the RAG pipeline coming along?` },
      ],
      tips: ['结合你的技能: "Making good progress. I set up the vector database with ChromaDB yesterday and integrated the DeepSeek API. Today I'm working on the retrieval pipeline — should have a demo by EOD."', 'pipeline 读作 PIPE-line，注意重音']
    },
    {
      id: 'onboarding', time: '10:00 AM', icon: '📖', title: 'HR Benefits Chat',
      coworker: 'Lisa', coworkerRole: 'HR / People Ops',
      dialogue: [
        { speaker: 'them', text: `Hi ${name}! Let me walk you through our benefits. One thing I noticed — you have 10 years of experience across different tech stacks. That's quite impressive. Do you have questions about our learning & development budget?` },
      ],
      tips: ['可以问: "Yes! Do you cover conference tickets or online courses? I'm planning to dive deeper into distributed systems."', 'budget 读作 BUH-jit, development 重音在第2音节']
    },
    {
      id: 'codebase', time: '11:00 AM', icon: '💻', title: 'Architecture Deep Dive',
      coworker: 'Alex', coworkerRole: 'Staff Engineer',
      dialogue: [
        { speaker: 'them', text: `Since you've worked with Kitex and Kratos at TAL, you'll feel right at home. We use a similar Go microservice stack. Our robot fleet communicates via gRPC — have you worked with gRPC streaming before?` },
      ],
      tips: ['聊具体经验: "I used gRPC for service-to-service communication with Protobuf. Haven't done streaming yet, but I'm familiar with the concepts. What's the typical message size from the robots?"', 'gRPC 读作 G-R-P-C，Protobuf 读作 PRO-to-buf']
    },
    {
      id: 'lunch', time: '12:30 PM', icon: '🍕', title: 'Team Lunch Chat',
      coworker: 'Jessica', coworkerRole: 'Product Manager',
      dialogue: [
        { speaker: 'them', text: `Hey ${name}! A bunch of us are going to that hotpot place. So I heard you built a whole AI knowledge base and learning roadmap for yourself? That's pretty dedicated — what made you go deep into AI?` },
      ],
      tips: ['自然聊: "I started by watching 3Blue1Brown and reading papers. Built a personal knowledge base with VitePress, documented everything from CNN to Transformers. It just clicked for me — I wanted to understand how these models actually work."', 'knowledge base 连读, VitePress 读作 veet-press']
    },
    {
      id: 'pr', time: '2:00 PM', icon: '🔍', title: 'Code Review Session',
      coworker: 'David', coworkerRole: 'Senior Engineer',
      dialogue: [
        { speaker: 'them', text: `Hey, I just opened a PR for the robot config management module. Since you built something similar at your last company, could you take a look? I'd love to hear how you handled version management for robot firmware.` },
      ],
      tips: ['结合经验: "Sure! At my last job we used a versioned config system — each robot firmware version had its own config snapshot. Let me check your approach and I'll leave some comments."', 'firmware 读作 FIRM-ware，version 的 s 是 /ʒ/']
    },
    {
      id: 'oneonone', time: '3:30 PM', icon: '🤝', title: '1:1 with Tech Lead',
      coworker: 'Mike', coworkerRole: 'Tech Lead',
      dialogue: [
        { speaker: 'them', text: `How's everything going? I noticed you've been pushing commits on the LLM service already. I want to make sure you're not feeling overwhelmed — also, what area do you want to grow in over the next 6 months?` },
      ],
      tips: ['坦率回答: "It's going well! I'm excited about the LLM work. In the next 6 months I want to get deeper into distributed systems and model serving infrastructure. Maybe take on the inference optimization work."', 'overwhelmed 读作 o-ver-WELMD, optimization 重音在第3音节']
    },
    {
      id: 'wrapup', time: '4:30 PM', icon: '📝', title: 'Day Wrap-up',
      coworker: 'Sarah', coworkerRole: 'Senior Robotics Engineer',
      dialogue: [
        { speaker: 'them', text: `Hey ${name}, heading out? Great first day! By the way, I saw the GPU dashboard you built at your last company on GitHub. Would you be interested in presenting it at our next engineering all-hands? It could help the team understand multi-cloud monitoring.` },
      ],
      tips: ['积极回应: "Oh, that'd be awesome! I can walk through the architecture — how we aggregated GPU metrics across Alibaba Cloud, Baidu Cloud, and Volcano Cloud, then pushed alerts through Feishu. Give me a few days to prepare."', 'dashboard 读作 DASH-bord, aggregate 重音在第1音节']
    },
    {
      id: 'day2_standup', time: 'Day 2 · 9:30 AM', icon: '📋', title: 'Day 2 Standup',
      coworker: 'Mike', coworkerRole: 'Tech Lead',
      dialogue: [
        { speaker: 'them', text: `${name}, how's the RAG pipeline? I saw you pushed the vector store integration last night. Did you run into any issues with the embedding dimensions?` },
      ],
      tips: ['讲进展: "Good progress! The ChromaDB integration is done. I did hit one issue — the DeepSeek embedding model outputs 4096 dimensions but we had 1536 in our schema. Fixed it this morning. Should have the retrieval endpoint ready for testing by noon."', 'dimensions 读作 di-MEN-shuns']
    },
    {
      id: 'debug', time: 'Day 2 · 2:00 PM', icon: '🐛', title: 'Production Issue',
      coworker: 'Alex', coworkerRole: 'Staff Engineer',
      dialogue: [
        { speaker: 'them', text: `We're seeing latency spikes on the robot telemetry API — p99 went from 200ms to 2 seconds. You've dealt with production incidents before, right? Can you help me dig into the logs?` },
      ],
      tips: ['专业回应: "On it. Let me pull up the Grafana dashboard and check which service is the bottleneck. Is this affecting all robots or just a specific fleet? I'll trace the gRPC calls."', 'latency 读作 LAY-ten-see, bottleneck 重音在第1音节']
    },
    {
      id: 'design', time: 'Day 3 · 10:00 AM', icon: '🎨', title: 'Design Review',
      coworker: 'Jessica', coworkerRole: 'Product Manager',
      dialogue: [
        { speaker: 'them', text: `${name}, we're planning the next iteration of the robot AI assistant. You mentioned you've built AI agents before. What would you suggest for the conversation flow? Should we go with a state machine or let the LLM handle it?` },
      ],
      tips: ['给出观点: "I'd recommend a hybrid approach. Use a state machine for the critical paths — like emergency stop and safety checks — but let the LLM handle the conversational parts. At my last job I used a similar pattern with a guard-railed agent."', 'hybrid 读作 HIGH-brid, conversational 重音在第3音节']
    },
    {
      id: 'demo', time: 'Day 3 · 3:00 PM', icon: '🚀', title: 'Demo to VP',
      coworker: 'Mike', coworkerRole: 'Tech Lead',
      dialogue: [
        { speaker: 'them', text: `${name}, the VP of Engineering wants a quick demo of the LLM agent service tomorrow. Just 5 minutes — show the RAG pipeline, the robot Q&A, and the GPU monitoring dashboard. You up for it?` },
      ],
      tips: ['自信回应: "Absolutely. I'll prep a 5-minute walkthrough: RAG retrieval → LLM response → robot command. I'll have a backup local demo in case the API has issues. Anything specific the VP cares about?"', 'walkthrough 读作 WALK-through, backup 读作 BACK-up']
    }
  ];
}

// ── Setup ──────────────────────────────────────────────────────────
async function startSim() {
  const role = document.getElementById('roleSelect').value;
  const name = document.getElementById('nameInput').value.trim() || 'Patrick';
  const resume = document.getElementById('resumeInput').value.trim();

  userProfile = { role, name, resume };

  // Request mic ONCE
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    document.getElementById('micStatus').className = 'mic-status on';
    document.getElementById('micStatus').innerHTML = '<span class="mic-dot"></span> 麦克风已就绪';
  } catch (err) {
    // file:// protocol blocks getUserMedia in Chrome
    const isFileProtocol = window.location.protocol === 'file:';
    const msg = isFileProtocol
      ? '⚠️ file:// 协议不支持麦克风。请用 http://localhost:8080/work-sim.html 打开，录音功能需要 HTTP。\n\n你也可以只打字参与对话（录音按钮不可用）。'
      : '麦克风权限被拒绝: ' + err.message + '\n\n你可以只打字参与对话。';
    alert(msg);
    document.getElementById('micStatus').className = 'mic-status off';
    document.getElementById('micStatus').innerHTML = '<span class="mic-dot"></span> 麦克风不可用（仅文字模式）';
    // Hide record buttons
    document.querySelectorAll('[id^="recordBtn-"]').forEach(b => b.style.display = 'none');
  }

  document.getElementById('setupOverlay').style.display = 'none';
  document.getElementById('roleTag').textContent = role;
  initSim();
}

// ── Init ───────────────────────────────────────────────────────────
function initSim() {
  const scenes = buildScenes();
  const sceneList = document.getElementById('sceneList');
  sceneList.innerHTML = scenes.map((s, i) => `
    <div class="scene-item" id="scene-${s.id}" onclick="loadScene('${s.id}')">
      <span class="icon">${s.icon}</span>
      <div>
        <div>${s.title}</div>
        <div class="scene-time">${s.time} · ${s.coworker}</div>
      </div>
    </div>
  `).join('');

  // Load first scene
  loadScene('intro');
}

// ── Load scene ─────────────────────────────────────────────────────
function loadScene(id) {
  const scenes = buildScenes();
  const scene = scenes.find(s => s.id === id);
  if (!scene) return;

  currentScene = scene;

  // Highlight in sidebar
  document.querySelectorAll('.scene-item').forEach(el => el.classList.remove('active'));
  const sceneEl = document.getElementById(`scene-${id}`);
  if (sceneEl) sceneEl.classList.add('active');

  // Update header
  document.getElementById('topDay').textContent = `${scene.time} · ${scene.coworker} (${scene.coworkerRole})`;

  // Render chat
  const chat = document.getElementById('chatArea');
  chat.innerHTML = '';

  // Render dialogue
  scene.dialogue.forEach(d => {
    if (d.speaker === 'them') {
      addCoworkerMsg(scene, d.text, false);
    }
  });

  // Show hint
  showHint(scene.tips[0]);

  chat.scrollTop = chat.scrollHeight;
}

function addCoworkerMsg(scene, text, autoPlay = true) {
  const chat = document.getElementById('chatArea');
  const msgEl = document.createElement('div');
  msgEl.className = 'msg them';
  msgEl.innerHTML = `
    <div class="avatar">${scene.icon}</div>
    <div>
      <div class="name">${scene.coworker} · ${scene.coworkerRole}</div>
      <div class="bubble">${text}</div>
      <div class="msg-actions">
        <button class="btn-sm" onclick="playTTS(this, '${escapeHTML(text)}')">🔊 听TA说的</button>
        <button class="btn-sm" id="recordBtn-${scene.id}" onclick="startRecord('${scene.id}')">🎤 录音回复</button>
      </div>
      <div class="feedback-inline" id="feedback-${scene.id}"></div>
    </div>
  `;
  chat.appendChild(msgEl);
  chat.scrollTop = chat.scrollHeight;

  // Auto-play TTS
  if (autoPlay) {
    setTimeout(() => playTTS(null, text), 400);
  }
}

function addMyMsg(text) {
  const chat = document.getElementById('chatArea');
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  const msgEl = document.createElement('div');
  msgEl.className = 'msg me';
  msgEl.innerHTML = `
    <div class="avatar">😎</div>
    <div>
      <div class="name" style="text-align:right">You</div>
      <div class="bubble">${escapeHTML(text)}</div>
      <div class="time" style="text-align:right">${time}</div>
    </div>
  `;
  chat.appendChild(msgEl);
  chat.scrollTop = chat.scrollHeight;
}

// ── TTS (Google Translate MP3) ────────────────────────────────────
function playTTS(btn, text) {
  const audio = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(text));
  if (btn) {
    btn.textContent = '🔊 播放中...';
    btn.style.color = 'var(--green)';
  }
  audio.onended = audio.onerror = () => {
    if (btn) { btn.textContent = '🔊 听TA说的'; btn.style.color = ''; }
  };
  audio.play().catch(() => {
    if (btn) { btn.textContent = '⚠️ 重试'; setTimeout(() => { btn.textContent = '🔊 听TA说的'; btn.style.color = ''; }, 1500); }
  });
}

// ── Record (reuses stream — NO repeated permission prompt!) ──────
async function startRecord(sceneId) {
  if (!audioStream) {
    alert('麦克风未授权，请重新设置');
    return;
  }
  if (isRecording) return;

  isRecording = true;
  audioChunks = [];

  const btn = document.getElementById(`recordBtn-${sceneId}`);
  if (btn) { btn.textContent = '⏹ 停止录音'; btn.classList.add('recording'); }

  showHint('🔴 正在录音...说完后点「停止」');

  mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
  mediaRecorder.onstop = () => processRecord(sceneId);
  mediaRecorder.start();

  // Auto-stop after 8s
  setTimeout(() => {
    if (isRecording && mediaRecorder.state === 'recording') stopRecord(sceneId);
  }, 8000);
}

function stopRecord(sceneId) {
  if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
  isRecording = false;
  mediaRecorder.stop();

  const btn = document.getElementById(`recordBtn-${sceneId}`);
  if (btn) { btn.textContent = '🎤 录音回复'; btn.classList.remove('recording'); }
  hideHint();
}

async function processRecord(sceneId) {
  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  const url = URL.createObjectURL(blob);

  const feedbackDiv = document.getElementById(`feedback-${sceneId}`);
  if (!feedbackDiv) return;

  feedbackDiv.innerHTML = '🔍 正在分析...';
  feedbackDiv.classList.add('show');

  try {
    const alts = await doSpeechRecognition();
    const best = alts[0]?.text || '(未识别)';
    const conf = alts[0]?.confidence || 0;

    // Add user message to chat
    addMyMsg(best || '(你说的话)');

    // Feedback
    const words = best.split(/\s+/).length;
    const confColor = conf > 0.7 ? 'ok' : conf > 0.4 ? 'warn' : 'bad';
    feedbackDiv.innerHTML = `
      <span class="${confColor}">识别结果: "${best}" (置信度 ${Math.round(conf*100)}%)</span><br>
      🎯 词汇量: ${words} 词 · 
      ${conf < 0.5 ? '<span class="warn">发音可能不太清晰，再试试</span>' : '<span class="ok">发音清晰度 OK</span>'}<br>
      <button class="btn-sm" onclick="playMyLast()" style="margin-top:4px">🔁 听我读的</button>
      <button class="btn-sm" onclick="startRecord('${sceneId}')" style="margin-top:4px">🎤 重新录</button>
    `;

    // Store recording
    window._lastRecording = url;

    // Mark scene done
    const sceneEl = document.getElementById(`scene-${sceneId}`);
    if (sceneEl) sceneEl.classList.add('done');

  } catch (err) {
    feedbackDiv.innerHTML = `
      <span class="bad">⚠️ 识别失败: ${err.message}</span><br>
      请大声、清晰地朗读。周围噪音可能影响识别。
    `;
    addMyMsg('... (语音未识别)');
  }

  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
}

function playMyLast() {
  if (window._lastRecording) new Audio(window._lastRecording).play();
}

// ── Speech Recognition ─────────────────────────────────────────────
function doSpeechRecognition() {
  return new Promise((resolve, reject) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { reject(new Error('浏览器不支持，请用 Chrome')); return; }
    const r = new SR();
    r.lang = 'en-US';
    r.maxAlternatives = 3;
    r.onresult = e => {
      const alts = [];
      for (let i = 0; i < e.results[0].length; i++)
        alts.push({ text: e.results[0][i].transcript.trim(), confidence: e.results[0][i].confidence });
      resolve(alts);
    };
    r.onerror = e => reject(new Error(e.error));
    r.onnomatch = () => reject(new Error('未识别到语音'));
    r.start();
  });
}

// ── Text input ─────────────────────────────────────────────────────
function sendText() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text) return;
  addMyMsg(text);
  input.value = '';
  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
}

// ── Helpers ────────────────────────────────────────────────────────
function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showHint(msg) { const bar = document.getElementById('hintBar'); bar.textContent = msg; bar.classList.add('show'); }
function hideHint() { document.getElementById('hintBar').classList.remove('show'); }

// ── Enable send button when typing ─────────────────────────────────
document.getElementById('textInput').addEventListener('input', function() {
  document.getElementById('sendBtn').disabled = !this.value.trim();
});

// ── Load voices for TTS fallback ───────────────────────────────────
speechSynthesis.getVoices();
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
</script>
