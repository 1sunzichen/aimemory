<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外企工作模拟 · English at Work</title>
<style>
  :root {
    --bg: #0f0f1a; --card: #1a1a2e; --accent: #4a9eff;
    --green: #2ecc71; --red: #e74c3c; --yellow: #f39c12; --purple: #a855f7;
    --text: #e0e0e0; --sub: #888; --border: #2a2a3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
  }
  .sidebar {
    width: 260px; background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px; flex-shrink: 0;
  }
  .sidebar h2 { font-size: 16px; color: #fff; margin-bottom: 4px; }
  .sidebar .subtitle { font-size: 12px; color: var(--sub); margin-bottom: 20px; }
  .scene-list { flex: 1; overflow-y: auto; }
  .scene-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    font-size: 14px; margin-bottom: 4px; transition: .15s;
    display: flex; align-items: center; gap: 8px;
  }
  .scene-item:hover { background: rgba(255,255,255,.05); }
  .scene-item.active { background: rgba(74,158,255,.15); color: var(--accent); }
  .scene-item.done { opacity: .5; }
  .scene-item .icon { font-size: 18px; }
  .scene-time { font-size: 11px; color: var(--sub); }
  .sidebar-footer {
    border-top: 1px solid var(--border); padding-top: 14px; margin-top: 10px;
    font-size: 12px; color: var(--sub); line-height: 1.6;
  }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar .day { font-size: 14px; color: var(--sub); }
  .topbar .role-tag {
    background: var(--accent); color: #fff; padding: 4px 12px;
    border-radius: 12px; font-size: 13px; font-weight: 600;
  }
  .chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg {
    display: flex; gap: 10px; max-width: 90%; animation: fadeUp .3s;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
  .msg.them { align-self: flex-start; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .msg.them .avatar { background: var(--border); }
  .msg.me .avatar { background: var(--accent); }
  .msg .bubble-wrap { max-width: 100%; }
  .msg .bubble {
    padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.6;
  }
  .msg.them .bubble { background: var(--card); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.me .bubble { background: rgba(74,158,255,.2); border-top-right-radius: 4px; }
  .msg .name { font-size: 12px; color: var(--accent); margin-bottom: 4px; font-weight: 600; }
  .msg .time { font-size: 11px; color: var(--sub); margin-top: 4px; }

  /* Coworker translation */
  .trans-cn {
    font-size: 12px; color: var(--sub); margin-top: 6px; padding-top: 6px;
    border-top: 1px solid var(--border); line-height: 1.5;
  }
  .word-row {
    display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px;
  }
  .word-chip {
    padding: 3px 8px; border-radius: 12px; font-size: 11px;
    background: rgba(74,158,255,.1); color: var(--accent);
    cursor: pointer; transition: .15s; display: inline-flex; gap: 2px;
  }
  .word-chip:hover { background: rgba(74,158,255,.25); }
  .word-chip .en { font-weight: 600; }
  .word-chip .zh { color: var(--sub); }

  /* Actions */
  .msg-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn-sm {
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: rgba(0,0,0,.2); color: var(--text); font-size: 12px;
    cursor: pointer; transition: .15s;
  }
  .btn-sm:hover { border-color: var(--accent); }
  .btn-sm.recording {
    background: var(--red); color: #fff; border-color: var(--red);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,.4); }
    50% { box-shadow: 0 0 0 8px rgba(231,76,60,0); }
  }

  /* Input area with reply panel */
  .reply-panel {
    margin: 0 24px; padding: 14px 18px; border-radius: 12px;
    background: rgba(168,85,247,.08); border: 1px solid rgba(168,85,247,.2);
    display: none;
  }
  .reply-panel.show { display: block; }
  .reply-panel .label {
    font-size: 11px; color: var(--purple); margin-bottom: 6px;
    font-weight: 600; letter-spacing: .5px;
  }
  .reply-panel .en-text {
    font-size: 15px; color: #fff; line-height: 1.7;
    padding: 8px 12px; background: rgba(0,0,0,.2); border-radius: 8px;
    margin-bottom: 6px; word-break: break-word;
  }
  .reply-panel .cn-text {
    font-size: 12px; color: var(--sub); margin-bottom: 10px; line-height: 1.5;
  }
  .reply-panel .pho-row {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
  }
  .pho-chip {
    padding: 3px 8px; border-radius: 10px; font-size: 11px;
    background: rgba(245,158,11,.1); color: var(--yellow);
  }
  .pho-chip span { font-weight: 600; }
  .reply-actions {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .score-badge {
    padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 600;
  }
  .score-badge.good { background: rgba(46,204,113,.15); color: var(--green); }
  .score-badge.ok { background: rgba(243,156,18,.15); color: var(--yellow); }
  .score-badge.bad { background: rgba(231,76,60,.15); color: var(--red); }
  .score-badge.none { background: rgba(255,255,255,.05); color: var(--sub); }

  .input-area {
    padding: 12px 24px 16px; display: flex; gap: 10px; align-items: flex-end;
  }
  .input-area textarea {
    flex: 1; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; resize: none; outline: none;
    background: var(--card); color: var(--text); font-family: inherit;
    max-height: 80px;
  }
  .input-area textarea:focus { border-color: var(--accent); }
  .btn-send {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 18px;
    cursor: pointer; flex-shrink: 0;
  }
  .btn-send:disabled { opacity: .4; cursor: default; }

  .hint-bar {
    padding: 8px 24px; background: rgba(243,156,18,.1);
    border-top: 1px solid rgba(243,156,18,.3); font-size: 13px;
    text-align: center; color: var(--yellow); display: none;
  }
  .hint-bar.show { display: block; }

  .mic-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 4px 10px; border-radius: 12px;
  }
  .mic-status.on { background: rgba(46,204,113,.15); color: var(--green); }
  .mic-status.off { background: rgba(231,76,60,.15); color: var(--red); }
  .mic-dot { width: 8px; height: 8px; border-radius: 50%; }
  .mic-status.on .mic-dot { background: var(--green); }
  .mic-status.off .mic-dot { background: var(--red); }

  .start-hint {
    text-align: center; padding: 60px 20px; color: var(--sub); font-size: 15px; line-height: 2;
  }
  .start-hint button {
    margin-top: 16px; padding: 14px 40px; background: var(--green); color: #fff;
    border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer;
  }
  .start-hint button:hover { opacity: .9; }

  .feedback-bar {
    margin: 0 24px 4px; padding: 8px 14px; border-radius: 8px;
    font-size: 13px; display: none;
  }
  .feedback-bar.show { display: block; }
  .feedback-bar .ok { color: var(--green); }
  .feedback-bar .warn { color: var(--yellow); }
  .feedback-bar .bad { color: var(--red); }
</style>
</head>
<body>

<div class="sidebar">
  <h2>🏢 Day at Work</h2>
  <div class="subtitle" id="dayLabel">AI Full-Stack Engineer</div>
  <div class="scene-list" id="sceneList"></div>
  <div class="sidebar-footer">
    <div class="mic-status off" id="micStatus"><span class="mic-dot"></span> 点击下方按钮授权</div>
    <div style="margin-top:6px">💡 点场景切换<br>🔊 听同事说话<br>🎤 跟读练习发音</div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <span class="day" id="topDay">Click "Start" to begin</span>
    <span class="role-tag">AI Full-Stack Engineer</span>
  </div>
  <div class="hint-bar" id="hintBar"></div>
  <div class="chat" id="chatArea">
    <div class="start-hint">
      <div style="font-size:40px;margin-bottom:12px">🤖</div>
      <div>AI Full-Stack Engineer · 10 years exp</div>
      <div style="font-size:13px">Go / React / Python / LLM / RAG / K8s</div>
      <button onclick="initApp()">🎤 授权麦克风，开始工作</button>
      <div style="font-size:12px;margin-top:8px">只需授权一次 · 全程不弹窗</div>
    </div>
  </div>

  <!-- Suggested reply panel -->
  <div class="reply-panel" id="replyPanel">
    <div class="label">📝 建议回复 — 先跟读练发音，再正式回复</div>
    <div class="en-text" id="replyEn"></div>
    <div class="cn-text" id="replyCn"></div>
    <div class="pho-row" id="replyPho"></div>
    <div class="reply-actions">
      <button class="btn-sm" id="btnPractice" onclick="practiceReply()">🎤 跟读这句话</button>
      <button class="btn-sm" id="btnDone" onclick="finishPractice()" style="display:none;background:var(--green);color:#fff;border-color:var(--green);font-weight:600">✅ 读完</button>
      <button class="btn-sm" onclick="playTTS(null, document.getElementById('replyEn').textContent)">🔊 听标准发音</button>
      <span class="score-badge none" id="scoreBadge">—</span>
      <span style="font-size:12px;color:var(--sub)" id="scoreDetail"></span>
    </div>
  </div>

  <!-- Feedback bar -->
  <div class="feedback-bar" id="feedbackBar"></div>

  <div class="input-area">
    <textarea id="textInput" placeholder="编辑上方英文回复，或直接打字..." rows="1"></textarea>
    <button class="btn-send" onclick="sendText()" id="sendBtn" disabled>→</button>
  </div>
</div>

<audio id="ttsAudio" style="display:none"></audio>

<script>
// ── Profile ────────────────────────────────────────────────────────
var P = {
  name: 'Patrick',
  role: 'AI Full-Stack Engineer',
  skills: 'Go, React, Python, LLM/RAG, K8s, Docker, Gin, Kitex, Kratos, gRPC, Redis, MySQL',
  exp: '10yr full-stack. Robotics AI company (Go+React robot cloud). Previously TAL Education (Go microservices), Shansong (frontend).'
};

var audioStream = null, mediaRecorder = null, audioChunks = [];
var currentScene = null, isRecording = false;

// ── Scene data ─────────────────────────────────────────────────────
// Each scene: coworker text + translation + word chips + suggested reply
function buildScenes() {
  var n = P.name;
  return [
    {
      id:'intro', time:'9:00 AM', icon:'☕', title:'Morning Coffee Chat', coworker:'Sarah', role:'Senior Robotics Engineer',
      text: "Morning "+n+"! So you came from a robotics AI company too? I saw your resume — you worked on a robot cloud management platform. That is exactly what we are building here. Tell me about the GPU monitoring system you built.",
      cn: "早上好"+n+"！你之前也是机器人AI公司的？我看了你的简历——你做过机器人云管理平台，我们这儿做的正好一样。跟我说说你做的GPU监控系统吧。",
      words: [
        {en:'robotics',zh:'机器人技术'},{en:'resume',zh:'简历'},{en:'platform',zh:'平台'},
        {en:'exactly',zh:'恰好'},{en:'monitoring',zh:'监控'},{en:'system',zh:'系统'}
      ],
      reply: "Yeah! We built a Go+React platform for robot config management and multi-cloud GPU monitoring. We used Feishu bots for alerts — it saved the team hours every week.",
      replyCn: "是的！我们用Go+React做了个机器人配置管理和多云GPU监控平台。用飞书机器人推送告警——每周给团队省了好多时间。",
      pho: [{w:'robot',p:'ROW-bot'},{w:'platform',p:'PLAT-form'},{w:'monitoring',p:'MON-i-ter-ing'},{w:'alerts',p:'a-LERTS'},{w:'config',p:'CON-fig'}]
    },
    {
      id:'standup', time:'9:30 AM', icon:'📋', title:'Daily Standup', coworker:'Mike', role:'Tech Lead',
      text: "Alright team, standup time. "+n+", you are working on the new LLM agent service today, right? How is the RAG pipeline coming along?",
      cn: "好了大家，站会时间。"+n+"，你今天在做新的LLM agent服务对吧？RAG pipeline进展怎么样？",
      words: [
        {en:'standup',zh:'站会'},{en:'agent',zh:'智能体'},{en:'service',zh:'服务'},
        {en:'pipeline',zh:'流水线'},{en:'coming along',zh:'进展'}
      ],
      reply: "Making good progress. I set up the vector database with ChromaDB yesterday and integrated the DeepSeek API. Today I am working on the retrieval pipeline — should have a demo by end of day.",

      pho: [{w:'progress',p:'PRO-gress'},{w:'vector',p:'VEC-tor'},{w:'database',p:'DAY-ta-base'},{w:'integrated',p:'IN-te-gray-ted'},{w:'retrieval',p:'re-TREE-val'},{w:'pipeline',p:'PIPE-line'}]
    },
    {
      id:'onboarding', time:'10:00 AM', icon:'📖', title:'HR Benefits Chat', coworker:'Lisa', role:'HR/People Ops',
      text: "Hi "+n+"! Let me walk you through our benefits. One thing I noticed — you have 10 years of experience across different tech stacks. That is quite impressive. Do you have questions about our learning and development budget?",
      cn: "嗨"+n+"！我给你介绍一下我们的福利。我注意到你有10年的经验，跨越不同技术栈，相当厉害。对我们的学习和进修预算有什么问题吗？",
      words: [

        {en:'development',zh:'发展'},{en:'budget',zh:'预算'}
      ],
      reply: "Yes! Do you cover conference tickets or online courses? I am planning to dive deeper into distributed systems this year.",
      replyCn: "有的！你们报销会议门票或者网课吗？我今年打算深入学分布式系统。",
      pho: [{w:'conference',p:'CON-fer-ence'},{w:'courses',p:'KOR-ses'},{w:'distributed',p:'dis-TRIB-u-ted'},{w:'systems',p:'SIS-tems'}]
    },
    {
      id:'codebase', time:'11:00 AM', icon:'💻', title:'Architecture Deep Dive', coworker:'Alex', role:'Staff Engineer',
      text: "Since you have worked with Kitex and Kratos at TAL, you will feel right at home. We use a similar Go microservice stack. Our robot fleet communicates via gRPC — have you worked with gRPC streaming before?",
      cn: "你在好未来用过Kitex和Kratos，来这儿应该很顺手。我们用类似的Go微服务技术栈。我们机器人集群用gRPC通信——你之前用过gRPC streaming吗？",
      words: [

        {en:'streaming',zh:'流式传输'}
      ],
      reply: "I used gRPC for service-to-service communication with Protobuf. I have not done streaming yet, but I am familiar with the concepts. What is the typical message size from the robots?",
      replyCn: "我用过gRPC做服务间通信，用Protobuf定义协议。streaming还没做过，但了解概念。机器人那边典型的消息大小是多少？",
      pho: [{w:'communication',p:'com-MU-ni-ca-tion'},{w:'Protobuf',p:'PRO-to-buf'},{w:'concepts',p:'CON-cepts'},{w:'typical',p:'TI-pi-cal'}]
    },
    {
      id:'lunch', time:'12:30 PM', icon:'🍕', title:'Team Lunch Chat', coworker:'Jessica', role:'Product Manager',

      pho: [{w:'knowledge',p:'NOL-edge'},{w:'documented',p:'DOC-u-men-ted'},{w:'Transformers',p:'trans-FOR-mers'},{w:'actually',p:'AC-chu-a-lly'},{w:'models',p:'MOD-els'}]

      reply: "Sure! At my last job we used a versioned config system — each robot firmware version had its own config snapshot. Let me check your approach and I will leave some comments.",
      replyCn: "没问题！上家公司我们用版本化配置系统——每个固件版本有自己的配置快照。让我看看你的方案，我会留些评论。",

    {

// ── Init ────────────────────────────────────────────────────────────
async function initApp() {
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    document.getElementById('micStatus').className = 'mic-status on';
    document.getElementById('micStatus').innerHTML = '<span class="mic-dot"></span> 麦克风已就绪';
  } catch(e) {
    document.getElementById('micStatus').className = 'mic-status off';
    document.getElementById('micStatus').innerHTML = '<span class="mic-dot"></span> 仅文字模式';
  }
  renderScenes();
  loadScene('intro');
}

function renderScenes() {
  var scenes = buildScenes(), html = '';
  for (var i = 0; i < scenes.length; i++) {
    var s = scenes[i];
    html += '<div class="scene-item" id="scene-'+s.id+'" onclick="loadScene(\''+s.id+'\')">' +
      '<span class="icon">'+s.icon+'</span>' +
      '<div><div>'+escHtml(s.title)+'</div><div class="scene-time">'+escHtml(s.time)+' · '+escHtml(s.coworker)+'</div></div></div>';
  }
  document.getElementById('sceneList').innerHTML = html;
}

function loadScene(id) {
  var scenes = buildScenes(), scene = null;
  for (var i = 0; i < scenes.length; i++) { if (scenes[i].id === id) { scene = scenes[i]; break; } }
  if (!scene) return;
  currentScene = scene;

  // Update sidebar
  var items = document.querySelectorAll('.scene-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
  var el = document.getElementById('scene-'+id);
  if (el) el.classList.add('active');
  document.getElementById('topDay').textContent = scene.time + ' · ' + scene.coworker + ' (' + scene.role + ')';

  // Build word chips
  var chipsHTML = '';
  for (var i = 0; i < scene.words.length; i++) {
    var w = scene.words[i];
    chipsHTML += '<span class="word-chip" onclick="playWord(\''+escAttr(w.en)+'\')"><span class="en">'+escHtml(w.en)+'</span> <span class="zh">'+escHtml(w.zh)+'</span></span>';
  }

  // Coworker message
  var chat = document.getElementById('chatArea');
  chat.innerHTML =
    '<div class="msg them">' +
    '<div class="avatar">'+scene.icon+'</div>' +
    '<div class="bubble-wrap">' +
      '<div class="name">'+escHtml(scene.coworker)+' · '+escHtml(scene.role)+'</div>' +
      '<div class="bubble">'+escHtml(scene.text)+'</div>' +
      '<div class="trans-cn">🇨🇳 '+escHtml(scene.cn)+'</div>' +
      '<div class="word-row">'+chipsHTML+'</div>' +
      '<div class="msg-actions">' +
        '<button class="btn-sm" onclick="playTTS(this,\''+escAttr(scene.text)+'\')">🔊 听TA说的</button>' +
      '</div>' +
    '</div></div>';

  chat.scrollTop = chat.scrollHeight;

  // Update reply panel
  showReplyPanel(scene);
  showHint('💡 看下面「建议回复」→ 点 🎤 跟读 → 系统检查你的发音 → 满意后点 → 发送');
}

function showReplyPanel(scene) {
  var panel = document.getElementById('replyPanel');
  panel.classList.add('show');

  document.getElementById('replyEn').textContent = scene.reply;
  document.getElementById('replyCn').textContent = '🇨🇳 ' + scene.replyCn;

  // Phonetic chips
  var phoHTML = '';
  for (var i = 0; i < scene.pho.length; i++) {
    var p = scene.pho[i];
    phoHTML += '<span class="pho-chip"><span>'+escHtml(p.w)+'</span> /'+escHtml(p.p)+'/</span>';
  }
  document.getElementById('replyPho').innerHTML = phoHTML;

  // Reset score
  document.getElementById('scoreBadge').className = 'score-badge none';
  document.getElementById('scoreBadge').textContent = '—';
  document.getElementById('scoreDetail').textContent = '';

  // Put reply text into input
  document.getElementById('textInput').value = scene.reply;
  document.getElementById('sendBtn').disabled = false;

  // Reset practice button
  var b = document.getElementById('btnPractice');
  b.textContent = '🎤 跟读这句话';
  b.classList.remove('recording');

  // Hide feedback
  document.getElementById('feedbackBar').classList.remove('show');
}

function addMyMsg(text) {
  var chat = document.getElementById('chatArea');
  var now = new Date();
  var t = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  var div = document.createElement('div');
  div.className = 'msg me';
  div.innerHTML = '<div class="avatar">😎</div>' +
    '<div class="bubble-wrap"><div class="name" style="text-align:right">You</div>' +
    '<div class="bubble">'+escHtml(text)+'</div>' +
    '<div class="time" style="text-align:right">'+t+'</div></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// ── TTS ────────────────────────────────────────────────────────────
var _ttsVoices = [];
function loadVoices() { var v = speechSynthesis.getVoices(); if (v.length > 0) _ttsVoices = v; }
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;

function playTTS(btn, text) {
  var audio = document.getElementById('ttsAudio');
  var loaded = false, fbTimer = null;
  audio.src = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(text);
  if (btn) { btn.textContent = '🔊 加载中...'; btn.style.color = 'var(--yellow)'; }
  audio.oncanplaythrough = function() { loaded = true; if (fbTimer) clearTimeout(fbTimer); if (btn) { btn.textContent = '🔊 播放中...'; btn.style.color = 'var(--green)'; } };
  audio.onended = audio.onerror = function() { if (btn) { btn.textContent = '🔊 听TA说的'; btn.style.color = ''; } };
  audio.play().catch(function(){});

  fbTimer = setTimeout(function() {
    if (loaded) return;
    if (btn) { btn.textContent = '🔊 系统语音...'; btn.style.color = 'var(--accent)'; }
    audio.pause(); audio.src = '';
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US'; utter.rate = 0.85; utter.volume = 1;
    if (_ttsVoices.length === 0) loadVoices();
    for (var i = 0; i < _ttsVoices.length; i++) {
      if (_ttsVoices[i].lang === 'en-US' && _ttsVoices[i].name.indexOf('Google') !== -1) { utter.voice = _ttsVoices[i]; break; }
    }
    if (!utter.voice) { for (var i = 0; i < _ttsVoices.length; i++) { if (_ttsVoices[i].lang === 'en-US') { utter.voice = _ttsVoices[i]; break; } } }
    utter.onend = utter.onerror = function() { if (btn) { btn.textContent = '🔊 听TA说的'; btn.style.color = ''; } };
    speechSynthesis.cancel(); speechSynthesis.speak(utter);
    var rid = setInterval(function() { if (speechSynthesis.speaking) { speechSynthesis.pause(); speechSynthesis.resume(); } else clearInterval(rid); }, 4000);
    setTimeout(function(){ clearInterval(rid); }, 30000);
  }, 2500);
}

function playWord(word) { playTTS(null, word); }

// ── Practice: record & check pronunciation ─────────────────────────
var _pracTimer = null;

function practiceReply() {
  if (!audioStream) { alert('麦克风不可用'); return; }
  if (isRecording) return;

  // Clean up any previous recorder
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.onstop = null;
    mediaRecorder.stop();
  }
  if (_pracTimer) clearTimeout(_pracTimer);

  isRecording = true; audioChunks = [];
  var btn = document.getElementById('btnPractice');
  if (btn) { btn.textContent = '🔴 录音中...'; btn.classList.add('recording'); }

  var doneBtn = document.getElementById('btnDone');
  if (doneBtn) { doneBtn.style.display = 'inline-flex'; doneBtn.textContent = '✅ 读完'; }

  showHint('🎤 大声朗读上方英文 — 读完后点 ✅ 读完');
  // Add volume meter
  var hintBar = document.getElementById('hintBar');
  var meterHTML = '<span id="volMeter" style="display:inline-block;width:120px;height:4px;background:var(--border);border-radius:2px;vertical-align:middle;margin-left:8px;overflow:hidden">' +
    '<span id="volFill" style="display:block;height:100%;background:var(--green);border-radius:2px;width:0%;transition:width .15s"></span></span>';
  hintBar.innerHTML = '🎤 大声朗读 — 读完点 ✅ 读完 ' + meterHTML;

  try {
    mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
  } catch(e) {
    mediaRecorder = new MediaRecorder(audioStream);
  }

  var stopped = false;

  mediaRecorder.ondataavailable = function(e) {
    if (e.data && e.data.size > 0) audioChunks.push(e.data);
  };

  mediaRecorder.onstop = function() {
    if (stopped) return;
    stopped = true;
    if (_pracTimer) clearTimeout(_pracTimer);
    cleanupVol();
    analyzePractice();
  };

  mediaRecorder.onerror = function(e) {
    if (stopped) return;
    stopped = true;
    if (_pracTimer) clearTimeout(_pracTimer);
    cleanupVol();
    isRecording = false;
    if (btn) { btn.textContent = '🎤 跟读这句话'; btn.classList.remove('recording'); }
    if (doneBtn) doneBtn.style.display = 'none';
    hideHint();
    var fb = document.getElementById('feedbackBar');
    fb.innerHTML = '<span class="bad">⚠️ 录音出错，请重试</span>';
    fb.classList.add('show');
  };

  mediaRecorder.start(1000); // timeslice: fire ondataavailable every 1s

  // Volume meter: create analyser to show real-time audio level
  var actx = new AudioContext();
  var src = actx.createMediaStreamSource(audioStream);
  var ana = actx.createAnalyser();
  ana.fftSize = 256;
  src.connect(ana);

  var volTimer = setInterval(function() {
    var data = new Uint8Array(ana.frequencyBinCount);
    ana.getByteFrequencyData(data);
    var avg = 0;
    for (var i = 0; i < data.length; i++) avg += data[i];
    avg = avg / data.length;
    var pct = Math.min(100, avg * 2);
    var fill = document.getElementById('volFill');
    if (fill) fill.style.width = pct + '%';

    // Change hint color if very quiet
    var hint = document.getElementById('hintBar');
    if (hint && avg < 5) hint.style.color = 'var(--yellow)';
    else if (hint) hint.style.color = '';
  }, 150);

  // Cleanup on stop
  var cleanupVol = function() {
    clearInterval(volTimer);
    actx.close();
    var fill = document.getElementById('volFill');
    if (fill) fill.style.width = '0%';
  };

  // Safety: auto-stop after 15 seconds max
  _pracTimer = setTimeout(function() {
    if (isRecording && !stopped) finishPractice();
  }, 15000);
}

function finishPractice() {
  if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
  if (_pracTimer) clearTimeout(_pracTimer);
  isRecording = false;

  // Remove onstop to avoid double-fire, then stop
  mediaRecorder.onstop = null;
  try { mediaRecorder.stop(); } catch(e) {}

  // If stop didn't fire onstop (already cleared), manually trigger
  var btn = document.getElementById('btnPractice');
  if (btn) { btn.textContent = '🎤 跟读这句话'; btn.classList.remove('recording'); }
  var doneBtn = document.getElementById('btnDone');
  if (doneBtn) doneBtn.style.display = 'none';
  hideHint();

  // Analyze after a short delay
  setTimeout(function() { analyzePractice(); }, 100);
}

function analyzePractice() {
  var blob = new Blob(audioChunks, { type: 'audio/webm' });
  var url = URL.createObjectURL(blob);
  window._pracRec = url;

  var fb = document.getElementById('feedbackBar');
  fb.classList.add('show');
  fb.style.background = 'rgba(74,158,255,.08)';

  // Self-assessment: no Google API needed (blocked in China)
  fb.innerHTML =
    '<span style="color:var(--accent)">🎧 录音完成 — 对照标准发音自评</span><br>' +
    '<button class="btn-sm" onclick="var a=new Audio(window._pracRec);a.play()" style="margin-top:6px;font-weight:600">🔁 听我的录音</button> ' +
    '<button class="btn-sm" onclick="playTTS(null,\''+escAttr(currentScene.reply)+'\')" style="margin-top:6px;font-weight:600">🔊 听标准发音</button> ' +
    '<button class="btn-sm" onclick="practiceReply()" style="margin-top:6px">🔄 再录一次</button>' +
    '<div style="margin-top:10px;font-size:13px;color:var(--sub)">👆 先听自己的录音，再听标准 — 对比后自己打分：</div>' +
    '<div style="display:flex;gap:6px;margin-top:6px">' +
      '<button class="btn-sm" onclick="selfScore(90)" style="background:rgba(46,204,113,.15);color:var(--green);border-color:var(--green)">✅ 很像 (90%)</button>' +
      '<button class="btn-sm" onclick="selfScore(65)" style="background:rgba(243,156,18,.15);color:var(--yellow);border-color:var(--yellow)">⚠️ 还行 (65%)</button>' +
      '<button class="btn-sm" onclick="selfScore(30)" style="background:rgba(231,76,60,.15);color:var(--red);border-color:var(--red)">❌ 差很多 (30%)</button>' +
    '</div>';

  document.getElementById('scoreBadge').className = 'score-badge none';
  document.getElementById('scoreBadge').textContent = '👂';
  document.getElementById('scoreDetail').textContent = '自评中...';
}

function selfScore(score) {
  var sb = document.getElementById('scoreBadge');
  var sd = document.getElementById('scoreDetail');
  var fb = document.getElementById('feedbackBar');

  if (score >= 80) {
    sb.className = 'score-badge good'; sb.textContent = '✅ '+score+'%';
    sd.textContent = '很好！点 → 发送';
    fb.style.background = 'rgba(46,204,113,.1)';
    fb.innerHTML = '<span class="ok">✅ 自评 '+score+'% — 发音不错！可以正式回复了</span>';
  } else if (score >= 50) {
    sb.className = 'score-badge ok'; sb.textContent = '⚠️ '+score+'%';
    sd.textContent = '再练练';
    fb.style.background = 'rgba(243,156,18,.1)';
    fb.innerHTML = '<span class="warn">⚠️ 自评 '+score+'% — 建议再练一次，重点听单词发音</span>';
  } else {
    sb.className = 'score-badge bad'; sb.textContent = '❌ '+score+'%';
    sd.textContent = '多练';
    fb.style.background = 'rgba(231,76,60,.08)';
    fb.innerHTML = '<span class="bad">❌ 自评 '+score+'% — 先逐个单词跟读，点下面单词标签听单个发音</span>';
  }
}

function levenshtein(a, b) {
  if (!a || !b) return Math.max(a.length||0, b.length||0);
  var m = [], i, j;
  for (i = 0; i <= a.length; i++) { m[i] = [i]; }
  for (j = 0; j <= b.length; j++) { m[0][j] = j; }
  for (i = 1; i <= a.length; i++)
    for (j = 1; j <= b.length; j++)
      m[i][j] = a[i-1] === b[j-1] ? m[i-1][j-1] : Math.min(m[i-1][j], m[i][j-1], m[i-1][j-1]) + 1;
  return m[a.length][b.length];
}

// ── Send text ──────────────────────────────────────────────────────
function sendText() {
  var input = document.getElementById('textInput');
  var text = input.value.trim();
  if (!text) return;
  addMyMsg(text);
  input.value = '';

  // Mark scene done
  if (currentScene) {
    var el = document.getElementById('scene-'+currentScene.id);
    if (el) el.classList.add('done');
  }

  // Clear feedback
  document.getElementById('feedbackBar').classList.remove('show');
  document.getElementById('scoreBadge').className = 'score-badge none';
  document.getElementById('scoreBadge').textContent = '—';
  document.getElementById('scoreDetail').textContent = '';

  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
}

document.getElementById('textInput').addEventListener('input', function() {
  document.getElementById('sendBtn').disabled = !this.value.trim();
});

// ── Helpers ────────────────────────────────────────────────────────
function escHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return s.replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\\/g,'\\\\'); }
function showHint(m) { var b = document.getElementById('hintBar'); b.textContent = m; b.classList.add('show'); }
function hideHint() { document.getElementById('hintBar').classList.remove('show'); }
