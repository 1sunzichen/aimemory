<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外企工作模拟 · English at Work</title>
<style>
  :root {
    --bg: #0f0f1a; --card: #1a1a2e; --accent: #4a9eff;
    --green: #2ecc71; --red: #e74c3c; --yellow: #f39c12;
    --text: #e0e0e0; --sub: #888; --border: #2a2a3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex;
  }
  .sidebar {
    width: 260px; background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px; flex-shrink: 0;
  }
  .sidebar h2 { font-size: 16px; color: #fff; margin-bottom: 4px; }
  .sidebar .subtitle { font-size: 12px; color: var(--sub); margin-bottom: 20px; }
  .scene-list { flex: 1; overflow-y: auto; }
  .scene-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    font-size: 14px; margin-bottom: 4px; transition: .15s;
    display: flex; align-items: center; gap: 8px;
  }
  .scene-item:hover { background: rgba(255,255,255,.05); }
  .scene-item.active { background: rgba(74,158,255,.15); color: var(--accent); }
  .scene-item.done { opacity: .5; }
  .scene-item .icon { font-size: 18px; }
  .scene-time { font-size: 11px; color: var(--sub); }
  .sidebar-footer {
    border-top: 1px solid var(--border); padding-top: 14px; margin-top: 10px;
    font-size: 12px; color: var(--sub); line-height: 1.6;
  }
  .main {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }
  .topbar {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar .day { font-size: 14px; color: var(--sub); }
  .topbar .role-tag {
    background: var(--accent); color: #fff; padding: 4px 12px;
    border-radius: 12px; font-size: 13px; font-weight: 600;
  }
  .chat {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg {
    display: flex; gap: 10px; max-width: 85%; animation: fadeUp .3s;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
  .msg.them { align-self: flex-start; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .msg.them .avatar { background: var(--border); }
  .msg.me .avatar { background: var(--accent); }
  .msg .bubble {
    padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.6;
  }
  .msg.them .bubble { background: var(--card); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.me .bubble { background: rgba(74,158,255,.2); border-top-right-radius: 4px; }
  .msg .name { font-size: 12px; color: var(--accent); margin-bottom: 4px; font-weight: 600; }
  .msg .time { font-size: 11px; color: var(--sub); margin-top: 4px; }
  .msg-actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn-sm {
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: rgba(0,0,0,.2); color: var(--text); font-size: 12px;
    cursor: pointer; transition: .15s;
  }
  .btn-sm:hover { border-color: var(--accent); }
  .btn-sm.recording {
    background: var(--red); color: #fff; border-color: var(--red);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,.4); }
    50% { box-shadow: 0 0 0 8px rgba(231,76,60,0); }
  }
  .feedback-inline {
    margin-top: 6px; padding: 8px 12px; border-radius: 8px;
    background: rgba(0,0,0,.3); font-size: 13px; line-height: 1.6;
    display: none;
  }
  .feedback-inline.show { display: block; }
  .feedback-inline .ok { color: var(--green); }
  .feedback-inline .warn { color: var(--yellow); }
  .feedback-inline .bad { color: var(--red); }
  .hint-bar {
    padding: 8px 24px; background: rgba(243,156,18,.1);
    border-top: 1px solid rgba(243,156,18,.3); font-size: 13px;
    text-align: center; color: var(--yellow); display: none;
  }
  .hint-bar.show { display: block; }
  .input-area {
    padding: 16px 24px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end;
  }
  .input-area textarea {
    flex: 1; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; resize: none; outline: none;
    background: var(--card); color: var(--text); font-family: inherit;
    max-height: 80px;
  }
  .input-area textarea:focus { border-color: var(--accent); }
  .btn-send {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 18px;
    cursor: pointer; flex-shrink: 0;
  }
  .btn-send:disabled { opacity: .4; cursor: default; }
  .mic-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 4px 10px; border-radius: 12px;
  }
  .mic-status.on { background: rgba(46,204,113,.15); color: var(--green); }
  .mic-status.off { background: rgba(231,76,60,.15); color: var(--red); }
  .mic-dot { width: 8px; height: 8px; border-radius: 50%; }
  .mic-status.on .mic-dot { background: var(--green); }
  .mic-status.off .mic-dot { background: var(--red); }
  .start-hint {
    text-align: center; padding: 60px 20px; color: var(--sub); font-size: 15px; line-height: 2;
  }
  .start-hint button {
    margin-top: 16px; padding: 14px 40px; background: var(--green); color: #fff;
    border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer;
  }
  .start-hint button:hover { opacity: .9; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>🏢 Day at Work</h2>
  <div class="subtitle" id="dayLabel">AI Full-Stack Engineer</div>
  <div class="scene-list" id="sceneList"></div>
  <div class="sidebar-footer">
    <div class="mic-status off" id="micStatus"><span class="mic-dot"></span> 点击下方按钮授权</div>
    <div style="margin-top:6px">💡 点场景切换<br>🔊 听同事说话<br>🎤 录音回复</div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <span class="day" id="topDay">Click "Start" to begin</span>
    <span class="role-tag">AI Full-Stack Engineer</span>
  </div>
  <div class="hint-bar" id="hintBar"></div>
  <div class="chat" id="chatArea">
    <div class="start-hint">
      <div style="font-size:40px;margin-bottom:12px">🤖</div>
      <div>AI Full-Stack Engineer · 10 years exp</div>
      <div style="font-size:13px">Go / React / Python / LLM / RAG / K8s</div>
      <button onclick="initApp()">🎤 授权麦克风，开始工作</button>
      <div style="font-size:12px;margin-top:8px">只需授权一次 · 全程不弹窗</div>
    </div>
  </div>
  <div class="input-area">
    <textarea id="textInput" placeholder="打字回复（或按 🎤 录音）..." rows="1"></textarea>
    <button class="btn-send" onclick="sendText()" id="sendBtn" disabled>→</button>
  </div>
</div>

<script>
// ── Profile ────────────────────────────────────────────────────────
var P = {
  name: 'Patrick',
  role: 'AI Full-Stack Engineer',
  skills: 'Go, React, Python, LLM/RAG, K8s, Docker, Gin, Kitex, Kratos, gRPC, Redis, MySQL',
  exp: '10yr full-stack. Robotics AI company (Go+React robot cloud). Previously TAL Education (Go microservices), Shansong (frontend). GPU monitoring, Feishu bots, multi-cloud orchestration.'
};

var audioStream = null;
var mediaRecorder = null;
var audioChunks = [];
var currentScene = null;
var isRecording = false;
var initialized = false;

// ── Scenes ─────────────────────────────────────────────────────────
function buildScenes() {
  var n = P.name;
  return [
    { id:'intro', time:'9:00 AM', icon:'☕', title:'Morning Coffee Chat', coworker:'Sarah', role:'Senior Robotics Engineer',
      text: "Morning "+n+"! So you came from a robotics AI company too? I saw your resume — you worked on a robot cloud management platform. That is exactly what we are building here. Tell me about the GPU monitoring system you built.",
      tip: "用经历回应: \"Yeah! We built a Go+React platform for robot config management and multi-cloud GPU monitoring. We used Feishu bots for alerts — saved the team hours every week.\" · robot=ROW-bot" },
    { id:'standup', time:'9:30 AM', icon:'📋', title:'Daily Standup', coworker:'Mike', role:'Tech Lead',
      text: "Alright team, standup time. "+n+", you are working on the new LLM agent service today, right? How is the RAG pipeline coming along?",
      tip: "结合你的技能: \"Making good progress. I set up the vector database with ChromaDB yesterday and integrated the DeepSeek API. Today I'm working on the retrieval pipeline — should have a demo by EOD.\" · pipeline=PIPE-line" },
    { id:'onboarding', time:'10:00 AM', icon:'📖', title:'HR Benefits Chat', coworker:'Lisa', role:'HR/People Ops',
      text: "Hi "+n+"! Let me walk you through our benefits. One thing I noticed — you have 10 years of experience across different tech stacks. That is quite impressive. Do you have questions about our learning and development budget?",
      tip: "可以问: \"Yes! Do you cover conference tickets or online courses? I'm planning to dive deeper into distributed systems.\" · budget=BUH-jit" },
    { id:'codebase', time:'11:00 AM', icon:'💻', title:'Architecture Deep Dive', coworker:'Alex', role:'Staff Engineer',
      text: "Since you have worked with Kitex and Kratos at TAL, you will feel right at home. We use a similar Go microservice stack. Our robot fleet communicates via gRPC — have you worked with gRPC streaming before?",
      tip: "聊具体经验: \"I used gRPC for service-to-service communication with Protobuf. Haven't done streaming yet, but I'm familiar with the concepts. What's the typical message size from the robots?\" · gRPC=G-R-P-C" },
    { id:'lunch', time:'12:30 PM', icon:'🍕', title:'Team Lunch Chat', coworker:'Jessica', role:'Product Manager',
      text: "Hey "+n+"! A bunch of us are going to that hotpot place. So I heard you built a whole AI knowledge base and learning roadmap for yourself? That is pretty dedicated — what made you go deep into AI?",
      tip: "自然聊: \"I started by watching 3Blue1Brown and reading papers. Built a personal knowledge base with VitePress, documented everything from CNN to Transformers. It just clicked for me.\" · VitePress=veet-press" },
    { id:'pr', time:'2:00 PM', icon:'🔍', title:'Code Review Session', coworker:'David', role:'Senior Engineer',
      text: "Hey, I just opened a PR for the robot config management module. Since you built something similar at your last company, could you take a look? I would love to hear how you handled version management for robot firmware.",
      tip: "结合经验: \"Sure! At my last job we used a versioned config system — each robot firmware version had its own config snapshot. Let me check your approach and I will leave some comments.\" · firmware=FIRM-ware" },
    { id:'oneonone', time:'3:30 PM', icon:'🤝', title:'1:1 with Tech Lead', coworker:'Mike', role:'Tech Lead',
      text: "How is everything going? I noticed you have been pushing commits on the LLM service already. I want to make sure you are not feeling overwhelmed — also, what area do you want to grow in over the next 6 months?",
      tip: "坦率回答: \"It's going well! I'm excited about the LLM work. In the next 6 months I want to get deeper into distributed systems and model serving infrastructure. Maybe take on the inference optimization work.\" · overwhelmed=o-ver-WELMD" },
    { id:'wrapup', time:'4:30 PM', icon:'📝', title:'Day Wrap-up', coworker:'Sarah', role:'Senior Robotics Engineer',
      text: "Hey "+n+", heading out? Great first day! By the way, I saw the GPU dashboard you built at your last company on GitHub. Would you be interested in presenting it at our next engineering all-hands?",
      tip: "积极回应: \"Oh, that would be awesome! I can walk through the architecture — how we aggregated GPU metrics across Alibaba Cloud, Baidu Cloud, and Volcano Cloud, then pushed alerts through Feishu.\" · aggregate=AG-gre-gate" },
    { id:'day2_standup', time:'Day 2 · 9:30 AM', icon:'📋', title:'Day 2 Standup', coworker:'Mike', role:'Tech Lead',
      text: n+", how is the RAG pipeline? I saw you pushed the vector store integration last night. Did you run into any issues with the embedding dimensions?",
      tip: "讲进展: \"Good progress! The ChromaDB integration is done. I did hit one issue — the DeepSeek embedding model outputs 4096 dimensions but we had 1536 in our schema. Fixed it this morning.\" · dimensions=di-MEN-shuns" },
    { id:'debug', time:'Day 2 · 2:00 PM', icon:'🐛', title:'Production Issue', coworker:'Alex', role:'Staff Engineer',
      text: "We are seeing latency spikes on the robot telemetry API — p99 went from 200ms to 2 seconds. You have dealt with production incidents before, right? Can you help me dig into the logs?",
      tip: "专业回应: \"On it. Let me pull up the Grafana dashboard and check which service is the bottleneck. Is this affecting all robots or just a specific fleet? I will trace the gRPC calls.\" · latency=LAY-ten-see" },
    { id:'design', time:'Day 3 · 10:00 AM', icon:'🎨', title:'Design Review', coworker:'Jessica', role:'Product Manager',
      text: n+", we are planning the next iteration of the robot AI assistant. You mentioned you have built AI agents before. What would you suggest for the conversation flow? Should we go with a state machine or let the LLM handle it?",
      tip: "给观点: \"I would recommend a hybrid approach. Use a state machine for the critical paths — like emergency stop and safety checks — but let the LLM handle the conversational parts.\" · hybrid=HIGH-brid" },
    { id:'demo', time:'Day 3 · 3:00 PM', icon:'🚀', title:'Demo to VP', coworker:'Mike', role:'Tech Lead',
      text: n+", the VP of Engineering wants a quick demo of the LLM agent service tomorrow. Just 5 minutes — show the RAG pipeline, the robot Q and A, and the GPU monitoring dashboard. You up for it?",
      tip: "自信回应: \"Absolutely. I will prep a 5-minute walkthrough: RAG retrieval to LLM response to robot command. I will have a backup local demo in case the API has issues. Anything specific the VP cares about?\" · walkthrough=WALK-through" }
  ];
}

// ── Init ────────────────────────────────────────────────────────────
async function initApp() {
  // Request mic once
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    document.getElementById('micStatus').className = 'mic-status on';
    document.getElementById('micStatus').innerHTML = '<span class="mic-dot"></span> 麦克风已就绪';
  } catch(e) {
    document.getElementById('micStatus').className = 'mic-status off';
    document.getElementById('micStatus').innerHTML = '<span class="mic-dot"></span> 仅文字模式';
    document.querySelectorAll('[id^="recordBtn-"]').forEach(function(b){ b.style.display='none'; });
  }

  initialized = true;
  renderScenes();
  loadScene('intro');
}

function renderScenes() {
  var scenes = buildScenes();
  var html = '';
  for (var i = 0; i < scenes.length; i++) {
    var s = scenes[i];
    html += '<div class="scene-item" id="scene-'+s.id+'" onclick="loadScene(\''+s.id+'\')">' +
      '<span class="icon">'+s.icon+'</span>' +
      '<div><div>'+s.title+'</div><div class="scene-time">'+s.time+' · '+s.coworker+'</div></div></div>';
  }
  document.getElementById('sceneList').innerHTML = html;
}

function loadScene(id) {
  var scenes = buildScenes();
  var scene = null;
  for (var i = 0; i < scenes.length; i++) {
    if (scenes[i].id === id) { scene = scenes[i]; break; }
  }
  if (!scene) return;
  currentScene = scene;

  // Sidebar highlight
  var items = document.querySelectorAll('.scene-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
  var el = document.getElementById('scene-'+id);
  if (el) el.classList.add('active');

  document.getElementById('topDay').textContent = scene.time + ' · ' + scene.coworker + ' (' + scene.role + ')';

  // Render chat
  var chat = document.getElementById('chatArea');
  chat.innerHTML = '';

  // Coworker message
  var div = document.createElement('div');
  div.className = 'msg them';
  div.innerHTML = '<div class="avatar">'+scene.icon+'</div>' +
    '<div><div class="name">'+scene.coworker+' · '+scene.role+'</div>' +
    '<div class="bubble">'+esc(scene.text)+'</div>' +
    '<div class="msg-actions">' +
    '<button class="btn-sm" onclick="playTTS(this,\''+esc(scene.text)+'\')">🔊 听TA说的</button>' +
    '<button class="btn-sm" id="recordBtn-'+scene.id+'" onclick="startRecord(\''+scene.id+'\')">🎤 录音回复</button>' +
    '</div><div class="feedback-inline" id="feedback-'+scene.id+'"></div></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  // Show tip
  showHint('💡 ' + scene.tip);

  // Auto-play TTS
  setTimeout(function(){ playTTS(null, scene.text); }, 500);
}

function addMyMsg(text) {
  var chat = document.getElementById('chatArea');
  var now = new Date();
  var t = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  var div = document.createElement('div');
  div.className = 'msg me';
  div.innerHTML = '<div class="avatar">😎</div>' +
    '<div><div class="name" style="text-align:right">You</div>' +
    '<div class="bubble">'+esc(text)+'</div>' +
    '<div class="time" style="text-align:right">'+t+'</div></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// ── TTS ────────────────────────────────────────────────────────────
function playTTS(btn, text) {
  var audio = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(text));
  if (btn) { btn.textContent = '🔊 播放中...'; btn.style.color = 'var(--green)'; }
  audio.onended = audio.onerror = function() {
    if (btn) { btn.textContent = '🔊 听TA说的'; btn.style.color = ''; }
  };
  audio.play().catch(function() {
    if (btn) { btn.textContent = '⚠️ 重试'; setTimeout(function(){ btn.textContent = '🔊 听TA说的'; btn.style.color = ''; }, 1500); }
  });
}

// ── Record ─────────────────────────────────────────────────────────
function startRecord(sceneId) {
  if (!audioStream) { alert('麦克风不可用，请刷新页面重新授权'); return; }
  if (isRecording) return;
  isRecording = true;
  audioChunks = [];

  var btn = document.getElementById('recordBtn-'+sceneId);
  if (btn) { btn.textContent = '⏹ 停止录音'; btn.classList.add('recording'); }
  showHint('🔴 录音中... 说完后点「停止」');

  mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
  mediaRecorder.ondataavailable = function(e) { audioChunks.push(e.data); };
  mediaRecorder.onstop = function() { processRecord(sceneId); };
  mediaRecorder.start();

  setTimeout(function() {
    if (isRecording && mediaRecorder.state === 'recording') stopRecord(sceneId);
  }, 8000);
}

function stopRecord(sceneId) {
  if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
  isRecording = false;
  mediaRecorder.stop();
  var btn = document.getElementById('recordBtn-'+sceneId);
  if (btn) { btn.textContent = '🎤 录音回复'; btn.classList.remove('recording'); }
  hideHint();
}

function processRecord(sceneId) {
  var blob = new Blob(audioChunks, { type: 'audio/webm' });
  var url = URL.createObjectURL(blob);
  window._lastRec = url;

  var fb = document.getElementById('feedback-'+sceneId);
  if (!fb) return;
  fb.innerHTML = '🔍 正在分析...';
  fb.classList.add('show');

  doSpeech().then(function(alts) {
    var best = alts[0] ? alts[0].text : '(未识别)';
    var conf = alts[0] ? alts[0].confidence : 0;
    addMyMsg(best || '(你说的话)');

    var words = best.split(/\s+/).length;
    var cc = conf > 0.7 ? 'ok' : conf > 0.4 ? 'warn' : 'bad';
    fb.innerHTML = '<span class="'+cc+'">识别: "'+best+'" (置信度 '+Math.round(conf*100)+'%)</span><br>' +
      '🎯 词汇: '+words+' 词 · ' +
      (conf < 0.5 ? '<span class="warn">发音可能不太清晰，再试试</span>' : '<span class="ok">发音清晰度 OK</span>') +
      '<br><button class="btn-sm" onclick="playLast()" style="margin-top:4px">🔁 听我读的</button>' +
      '<button class="btn-sm" onclick="startRecord(\''+sceneId+'\')" style="margin-top:4px">🎤 重新录</button>';

    var el = document.getElementById('scene-'+sceneId);
    if (el) el.classList.add('done');
  }).catch(function(err) {
    fb.innerHTML = '<span class="bad">⚠️ 识别失败: '+err.message+'</span><br>请大声、清晰地朗读。';
    addMyMsg('... (语音未识别)');
  });

  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
}

function playLast() {
  if (window._lastRec) new Audio(window._lastRec).play();
}

// ── Speech Recognition ─────────────────────────────────────────────
function doSpeech() {
  return new Promise(function(resolve, reject) {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { reject(new Error('请用 Chrome 或 Edge')); return; }
    var r = new SR();
    r.lang = 'en-US'; r.maxAlternatives = 3;
    r.onresult = function(e) {
      var alts = [];
      for (var i = 0; i < e.results[0].length; i++)
        alts.push({ text: e.results[0][i].transcript.trim(), confidence: e.results[0][i].confidence });
      resolve(alts);
    };
    r.onerror = function(e) { reject(new Error(e.error)); };
    r.onnomatch = function() { reject(new Error('未识别到语音')); };
    r.start();
  });
}

// ── Text input ─────────────────────────────────────────────────────
function sendText() {
  var input = document.getElementById('textInput');
  var text = input.value.trim();
  if (!text) return;
  addMyMsg(text);
  input.value = '';
  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
}

document.getElementById('textInput').addEventListener('input', function() {
  document.getElementById('sendBtn').disabled = !this.value.trim();
});

// ── Helpers ────────────────────────────────────────────────────────
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showHint(m) { var b = document.getElementById('hintBar'); b.textContent = m; b.classList.add('show'); }
function hideHint() { document.getElementById('hintBar').classList.remove('show'); }
</script>
</body>
</html>
